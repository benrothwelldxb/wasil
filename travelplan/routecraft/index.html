<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://routecraft.pages.dev/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="RouteCraft — discover the best overall travel experience within your budget, not just the cheapest flight."
    />

    <!-- Theme color: light/dark variants match the app's --background token
         (light 40 33% 98% ≈ #fbfaf8, dark 200 30% 7% ≈ #0d1417). -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1417" />

    <title>RouteCraft — Craft the journey, not just the flight</title>

    <!-- Open Graph / Twitter card: static site-level fallback tags. Per-route
         dynamic tags (results, journey detail) are owned elsewhere. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RouteCraft — Craft the journey, not just the flight" />
    <meta
      property="og:description"
      content="RouteCraft — discover the best overall travel experience within your budget, not just the cheapest flight."
    />
    <meta property="og:image" content="https://routecraft.pages.dev/og-image.png" />
    <meta property="og:url" content="https://routecraft.pages.dev/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RouteCraft — Craft the journey, not just the flight" />
    <meta
      name="twitter:description"
      content="RouteCraft — discover the best overall travel experience within your budget, not just the cheapest flight."
    />
    <meta name="twitter:image" content="https://routecraft.pages.dev/og-image.png" />

    <!-- vite-plugin-pwa injects <link rel="manifest"> automatically at build
         time (see vite.config.ts VitePWA manifest config) — not hand-authored
         here to avoid drifting out of sync with the generated filename. -->

    <!-- No-FOUC theme bootstrap, loaded as an external same-origin script
         (not inlined) so the page can ship a strict `script-src 'self'`
         CSP. Render-blocking (no defer) so it still runs pre-paint. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
