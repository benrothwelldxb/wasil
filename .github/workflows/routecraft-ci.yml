name: RouteCraft CI

on:
  pull_request:
    paths:
      - 'travelplan/routecraft/**'
      - '.github/workflows/routecraft-ci.yml'
  push:
    branches: [main]
    paths:
      - 'travelplan/routecraft/**'
      - '.github/workflows/routecraft-ci.yml'

concurrency:
  group: routecraft-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routecraft:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travelplan/routecraft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: travelplan/routecraft/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npx eslint . --max-warnings 0
      - name: Test + coverage
        run: npx vitest run --coverage
      - name: Build
        run: npx vite build
