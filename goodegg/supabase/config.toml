# Supabase CLI configuration for "Be a Good Egg".
# Minimal but valid — enough for `supabase start`, `supabase db reset`, and
# `supabase functions serve`.

project_id = "be-a-good-egg"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# The draw runner. verify_jwt = true means the platform validates the caller's
# JWT before the function runs; the function then re-checks organiser identity.
[functions.run-draw]
verify_jwt = true
