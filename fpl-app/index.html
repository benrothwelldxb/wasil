<!doctype html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- iOS "Add to Home Screen" — standalone launch + branded title. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="MyFPLScout" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0f1c48"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="Statistical projections, squad optimisation, and transfer planning for Fantasy Premier League."
    />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp / iMessage -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MyFPLScout" />
    <meta property="og:url" content="https://myfplscout.app/" />
    <meta
      property="og:title"
      content="MyFPLScout — Your personal Fantasy Premier League scout"
    />
    <meta
      property="og:description"
      content="Statistical projections, squad optimisation, transfers, and chip planning for Fantasy Premier League."
    />
    <meta property="og:image" content="https://myfplscout.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="MyFPLScout — your personal Fantasy Premier League scout"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="MyFPLScout — Your personal Fantasy Premier League scout"
    />
    <meta
      name="twitter:description"
      content="Statistical projections, squad optimisation, transfers, and chip planning for Fantasy Premier League."
    />
    <meta name="twitter:image" content="https://myfplscout.app/og-image.png" />

    <title>MyFPLScout — Fantasy Premier League Companion</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the
      // wrong color scheme (FOUC). Mirrors the logic in src/utils/theme.ts.
      (function () {
        try {
          var storageKey = "fpl-app-storage";
          var stored = localStorage.getItem(storageKey);
          var theme = "system";
          if (stored) {
            var parsed = JSON.parse(stored);
            theme = (parsed && parsed.state && parsed.state.theme) || "system";
          }
          var isDark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
        } catch (_) {
          /* no-op: fall back to default light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
