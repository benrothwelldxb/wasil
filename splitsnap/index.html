<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Snap a receipt. Tap who had what. Done." />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="canonical" href="https://myreceiptsplit.app/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MyReceiptSplit" />
    <meta property="og:title" content="MyReceiptSplit — Split receipts in seconds" />
    <meta property="og:description" content="Snap a receipt. Tap who had what. Done." />
    <meta property="og:url" content="https://myreceiptsplit.app/" />
    <meta property="og:image" content="https://myreceiptsplit.app/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MyReceiptSplit — Split receipts in seconds" />
    <meta name="twitter:description" content="Snap a receipt. Tap who had what. Done." />
    <meta name="twitter:image" content="https://myreceiptsplit.app/icons/icon-512.png" />

    <title>MyReceiptSplit — Split receipts in seconds</title>
    <script>
      // Apply persisted theme before paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('splitsnap-theme')
          var isDark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', isDark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
